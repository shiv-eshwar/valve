name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Test
        run: go test ./... -race -count=1

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Check endpoint
        run: |
          curl -sf -X POST http://127.0.0.1:8080/v1/check \
            -H 'Content-Type: application/json' \
            -d '{"key":{"subject":"ci","model":"m"},"limits":{"requests_per_minute":60,"tokens_per_minute":90000},"cost":{"requests":1,"tokens":10}}' \
            | tee /tmp/check.json
          grep -q '"allowed":true' /tmp/check.json
          curl -sf http://127.0.0.1:8080/metrics | grep -q valve_checks_total
      - name: Tear down
        if: always()
        run: docker compose down -v
