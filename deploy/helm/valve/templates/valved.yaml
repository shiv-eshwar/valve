apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "valve.fullname" . }}-config
data:
  REDIS_ADDR: {{ .Values.config.redisAddr | quote }}
  LISTEN: {{ .Values.config.listen | quote }}
  GRPC_LISTEN: {{ .Values.config.grpcListen | quote }}
  FAST_PATH: {{ .Values.config.fastPath | quote }}
  FAIL_MODE: {{ .Values.config.failMode | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "valve.fullname" . }}
  labels:
    app: {{ include "valve.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "valve.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "valve.fullname" . }}
    spec:
      containers:
        - name: valved
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
          envFrom:
            - configMapRef:
                name: {{ include "valve.fullname" . }}-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "valve.fullname" . }}
spec:
  selector:
    app: {{ include "valve.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
