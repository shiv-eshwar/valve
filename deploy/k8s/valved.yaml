apiVersion: v1
kind: ConfigMap
metadata:
  name: valved-config
data:
  REDIS_ADDR: "valve-redis:6379"
  LISTEN: ":8080"
  GRPC_LISTEN: ":9090"
  FAST_PATH: "true"
  FAIL_MODE: "closed"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valved
spec:
  replicas: 2
  selector:
    matchLabels:
      app: valved
  template:
    metadata:
      labels:
        app: valved
    spec:
      containers:
        - name: valved
          image: valve:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: valved-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: valved
spec:
  selector:
    app: valved
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
